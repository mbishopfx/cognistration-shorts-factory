name: Render Shorts (cloud)

# Renders the pending Cognistration Shorts on GitHub's runners.
# Nothing runs on the local machine: no venv, no node_modules, no staged MP4s.
#
# 1 AM / 2 AM / 3 AM US-Central  ->  06:00 / 07:00 / 08:00 UTC

on:
  # Cloud schedule is OFF: the local pipeline on Matt's Mac is the renderer now.
  # This workflow stays for manual dispatch only.
  # schedule:
  #   - cron: '0 6 */2 * *'
  #   - cron: '0 7 */2 * *'
  #   - cron: '0 8 */2 * *'
  workflow_dispatch:
    inputs:
      brain_state:
        description: Specific brain state to render (leave as "next" for the next queued item)
        required: false
        default: next
        type: choice
        options: [next, delta, theta, alpha, smr, beta, gamma]
      render_all:
        description: Render every pending item in the queue
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: render-shorts
  cancel-in-progress: false

jobs:
  render:
    # Guard against forks picking this up.
    if: github.repository == 'mbishopfx/cognistration-shorts-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system libraries for headless Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libglib2.0-0 \
            fonts-liberation

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Install Python dependencies and Chromium
        run: |
          pip install --quiet -r requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Check Drive credentials are present
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          for v in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set as a repository secret"
              exit 1
            fi
          done
          echo "Drive credentials present."

      - name: Render the next queued short, upload to Drive, and clean up
        env:
          COGNISTRATION_SHORTS_DRIVE_FOLDER_ID: ${{ vars.COGNISTRATION_SHORTS_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          REQUESTED="${{ github.event.inputs.brain_state }}"
          if [ "${{ github.event.inputs.render_all }}" = "true" ]; then
            python3 scripts/render_batch.py --all
          elif [ -n "$REQUESTED" ] && [ "$REQUESTED" != "next" ]; then
            python3 scripts/render_batch.py --target-state "$REQUESTED"
          else
            python3 scripts/render_batch.py
          fi

      - name: Commit the updated queue and metadata
        run: |
          git config user.name  "mbishopfx"
          git config user.email "mattbishopfx@gmail.com"
          git add state/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update batch queue and metadata after cloud render [skip ci]"
            git push
          fi

      - name: Report
        if: always()
        run: |
          echo "### Cloud render finished" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          with open("state/batch_queue.json") as f:
              q = json.load(f)
          for b in q.get("batches", []):
              line = f"- `{b['id']}` **{b['status']}**"
              if b.get("driveFileId"):
                  line += f" driveId `{b['driveFileId']}`"
              print(line)
          md = "state/metadata"
          if os.path.isdir(md):
              print("\nMetadata written: " + ", ".join(sorted(os.listdir(md))))
          PY
