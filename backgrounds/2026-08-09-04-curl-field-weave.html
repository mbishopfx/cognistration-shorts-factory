<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Curl Field Weave — BishopTech Visuals</title>
  <meta name="description" content="Original BishopTech generative motion sketch: threads follow a living vector field and leave soft silk traces">
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; min-height: 100%; overflow: hidden; background: #e7d4b7; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { display: block; width: 100vw !important; height: 100vh !important; }
    .hud { position: fixed; left: 18px; bottom: 16px; color: rgba(86,62,49,.68); font-size: 11px; letter-spacing: .08em; pointer-events: none; text-transform: uppercase; }
    .hud strong { color: rgba(86,62,49,.92); }
    .obs-mode .hud { display: none; }
  </style>
  <script src="p5.min.js"></script>
  <script>p5.disableFriendlyErrors = true;</script>
</head>
<body>
<div class="hud"><strong>Curl Field Weave</strong> · threads follow a living vector field and leave soft silk traces · 16:9 landscape · space pause · r reseed · s save</div>
<script>
// BishopTech Visuals / 2026-08-09-04-curl-field-weave
// Original variation family: noise flow field + particle advection + fade buffer
// Orientation: landscape
// Seed: 972192369
const CONFIG = { seed: 972192369, paused: false, dpr: 1 };
const COLORS = {"sand":"#e7d4b7","marble":"#f4e8d2","terracotta":"#b96f56","aegean":"#7da5aa","olive":"#8d9772","ochre":"#c39a5c","ink":"#563e31"};
const PALETTE = [
  { h: 16,  s: 42, b: 72, a: 30 }, // terracotta
  { h: 38,  s: 40, b: 84, a: 28 }, // warm ochre
  { h: 86,  s: 28, b: 68, a: 25 }, // olive leaf
  { h: 187, s: 30, b: 74, a: 28 }, // faded Aegean
  { h: 214, s: 28, b: 76, a: 25 }, // dusty lapis
  { h: 34,  s: 15, b: 98, a: 31 }  // sunlit marble
];
if (new URLSearchParams(location.search).get('obs') === '1') document.body.classList.add('obs-mode');
let phase = 0;
let artSeed = CONFIG.seed;

function setup() {
  pixelDensity(CONFIG.dpr);
  createCanvas(windowWidth, windowHeight);
  randomSeed(artSeed);
  noiseSeed(artSeed);
  colorMode(HSB, 360, 100, 100, 100);
  resetSketch();
}

function draw() {
  if (!CONFIG.paused) {
    background(37, 18, 91, 8);
for (const thread of threads) { thread.step(); thread.paint(); }
    phase += 0.007;
  }
}

function keyPressed() {
  if (key === ' ') CONFIG.paused = !CONFIG.paused;
  if (key === 'r' || key === 'R') { artSeed = floor(random(999999)); randomSeed(artSeed); noiseSeed(artSeed); resetSketch(); }
  if (key === 's' || key === 'S') saveCanvas('2026-08-09-04-curl-field-weave', 'png');
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); resetSketch(); }
function resetSketch() {
  background(37, 18, 91);
  noStroke();
  fill(35, 14, 98, 16);
  ellipse(width * .5, height * .48, max(width, height) * .95);
  noFill();
  stroke(32, 22, 54, 8);
  strokeWeight(1);
  const medallion = min(width, height) * .88;
  ellipse(width * .5, height * .48, medallion, medallion * .62);
  ellipse(width * .5, height * .48, medallion * .92, medallion * .56);
  threads = Array.from({length: 700}, () => new WeaveThread());
}

let threads = [];
class WeaveThread {
  constructor() { this.spawn(); }
  spawn() { this.x = random(width); this.y = random(height); this.px = this.x; this.py = this.y; this.palette = random(PALETTE); this.weight = random(.4, 1.35); this.strong = random() < .16; this.life = random(100, 520); }
  step() {
    this.px = this.x; this.py = this.y;
    const n = noise(this.x * .0035, this.y * .0035, phase * .18);
    const angle = n * TAU * 2.7 + sin(this.y * .002 + phase) * .5;
    this.x += cos(angle) * 1.8; this.y += sin(angle) * 1.8; this.life--;
    if (this.life < 0 || this.x < -20 || this.x > width + 20 || this.y < -20 || this.y > height + 20) this.spawn();
  }
  paint() {
    const hue = (this.palette.h + sin(phase * .8 + this.x * .003) * 3 + 360) % 360;
    const alpha = this.strong ? min(44, this.palette.a * 1.45) : this.palette.a;
    const brightness = this.strong ? max(58, this.palette.b - 8) : this.palette.b;
    stroke(hue, this.palette.s, brightness, alpha);
    strokeWeight(this.strong ? this.weight * 1.15 : this.weight);
    line(this.px, this.py, this.x, this.y);
  }
}

</script>
</body>
</html>
