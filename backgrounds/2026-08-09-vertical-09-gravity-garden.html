<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gravity Garden — BishopTech Visuals</title>
  <meta name="description" content="Original BishopTech generative motion sketch: seed-like motes fall into a rotating garden of temporary orbits">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; overflow: hidden; background: #070811; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { display: block; width: 100vw !important; height: 100vh !important; }
    .hud { position: fixed; left: 18px; bottom: 16px; color: rgba(216,228,255,.68); font-size: 11px; letter-spacing: .08em; pointer-events: none; text-transform: uppercase; }
    .hud strong { color: rgba(216,228,255,.92); }
    .obs-mode .hud { display: none; }
  </style>
  <script src="p5.min.js"></script>
  <script>p5.disableFriendlyErrors = true;</script>
</head>
<body>
<div class="hud"><strong>Gravity Garden</strong> · seed-like motes fall into a rotating garden of temporary orbits · 9:16 vertical · space pause · r reseed · s save</div>
<script>
// BishopTech Visuals / 2026-08-09-vertical-09-gravity-garden
// Original variation family: gravity wells + orbital capture + regenerative particles
// Orientation: vertical
// Seed: 989765460
const CONFIG = { seed: 989765460, paused: false, dpr: 1 };
const COLORS = {"ink":"#070811","deep":"#10152a","violet":"#8f7cff","cyan":"#67e8f9","coral":"#ff8f70","gold":"#f7d774","mist":"#d8e4ff"};
if (new URLSearchParams(location.search).get('obs') === '1') document.body.classList.add('obs-mode');
let phase = 0;
let artSeed = CONFIG.seed;

function setup() {
  pixelDensity(CONFIG.dpr);
  createCanvas(windowWidth, windowHeight);
  randomSeed(artSeed);
  noiseSeed(artSeed);
  colorMode(HSB, 360, 100, 100, 100);
  resetSketch();
}

function draw() {
  if (!CONFIG.paused) {
    background(145, 48, 4, 10); const wells = gardenWells();
for (const s of seeds) { s.step(wells); s.paint(); }
    phase += 0.01;
  }
}

function keyPressed() {
  if (key === ' ') CONFIG.paused = !CONFIG.paused;
  if (key === 'r' || key === 'R') { artSeed = floor(random(999999)); randomSeed(artSeed); noiseSeed(artSeed); resetSketch(); }
  if (key === 's' || key === 'S') saveCanvas('2026-08-09-vertical-09-gravity-garden', 'png');
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); resetSketch(); }
function resetSketch() { seeds = Array.from({length: 520}, () => new GardenSeed()); }

let seeds = [];
function gardenWells() { return [
  {x: width*.5 + cos(phase*.7)*width*.22, y: height*.48 + sin(phase*.8)*height*.18, mass: 1.5},
  {x: width*.5 + cos(phase*.7+PI)*width*.22, y: height*.52 + sin(phase*.8+PI)*height*.18, mass: 1.2}
]; }
class GardenSeed {
  constructor() { this.reset(); }
  reset() { this.x=random(width); this.y=random(height); this.px=this.x; this.py=this.y; this.vx=random(-.3,.3); this.vy=random(-.3,.3); this.h=random(20,90); this.age=0; }
  step(wells) { this.px=this.x; this.py=this.y; this.age++; for (const w of wells) { const dx=w.x-this.x, dy=w.y-this.y, d2=max(180,dx*dx+dy*dy); const f=w.mass*34/d2; this.vx+=dx*f-dy*.00065; this.vy+=dy*f+dx*.00065; } this.vx*=.992; this.vy*=.992; this.x+=this.vx; this.y+=this.vy; if(this.age>700||this.x<-60||this.x>width+60||this.y<-60||this.y>height+60)this.reset(); }
  paint(){stroke((this.h+phase*18)%360,72,100,34);strokeWeight(1.1);line(this.px,this.py,this.x,this.y);}
}

</script>
</body>
</html>
